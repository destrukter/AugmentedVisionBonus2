# Default asset library: model -> image assignments, resolved by FILE NAME.
#
# Everything in ./images (png/jpg/jpeg/bmp) and ./models (fbx) is uploaded
# automatically when the application starts, validated exactly like a manual
# upload. Assignments between them can be declared two ways:
#
#   1. Explicitly here, one pair per line (names matched case-insensitively):
#
#        model-file.fbx = image-file.png
#
#   2. Automatically by base name: a model and an image that share the same
#      stem are paired without any entry here, e.g.
#
#        models/dragon.fbx  +  images/dragon.png   ->  assigned
#
# A pair may carry an optional pose after a '|' - the model's transform
# relative to its image. Each part can be left out (in any order); anything
# missing defaults to the identity pose (translation 0, rotation 0, scale 1):
#
#        model-file.fbx = image-file.png | t=0,0.5,0 r=0,90,0 s=2
#        model-file.fbx = image-file.png | s=1,2,0.5
#
#   t = translation x,y,z    r = rotation in degrees x,y,z
#   s = scale, either one uniform value or per-axis x,y,z
#
# Saving a pose in the Configure window writes it back into this file
# automatically (for assets that live in this library), so poses survive
# restarts. Lines starting with '#' are comments and are preserved. Unknown
# file names are reported as warnings in the log and the Upload window.

test-model.fbx = test-marker.png
